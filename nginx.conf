worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream backend {
        server 127.0.0.1:8081;   # SpringBoot REST
    }
    upstream im_ws {
        server 127.0.0.1:9324;   # T-io WebSocket
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 120m;   # 对齐后端上传上限

        # 上传文件：直接由 nginx 出，不走 Java（对应 local.uploadUrl=/home/poetize/file/）
        location /static/ {
            alias /home/poetize/file/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # WebSocket：必须放在 / 之前（前缀匹配会命中 /socket）
        location /socket {
            proxy_pass http://im_ws;                 # 不带 URI，保留 /socket?Authorization=xxx
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;   # 升级头，WS 握手的关键
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;                 # 大于 T-io 心跳 600s，避免长连接被掐
            proxy_send_timeout 3600s;
        }

        # REST API
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
